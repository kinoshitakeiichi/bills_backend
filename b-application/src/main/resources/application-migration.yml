spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: bills
    schemas: bills
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: "1"
    baseline-description: pre-flyway-live-schema
    validate-on-migrate: true
    clean-disabled: true

  jpa:
    # Base application.yml still has defer-datasource-initialization=true from the
    # pre-Flyway era. With Flyway enabled that reverses the normal dependency:
    # Flyway waits for JPA while JPA waits for Flyway, producing a circular
    # entityManagerFactory <-> flyway dependency. Migration profile must restore
    # the standard order: DataSource -> Flyway -> Hibernate validation.
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
