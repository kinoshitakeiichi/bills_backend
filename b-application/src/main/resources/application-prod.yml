spring:
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  cache:
    disabled: false

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.tool.schema: info
